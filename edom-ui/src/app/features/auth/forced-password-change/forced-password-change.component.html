<div class="login-container">
  <p-card>
    <ng-template #header>
      <div class="login-header">
        <h2>eDom</h2>
        <p>Cambio Password Obbligatorio</p>
        <p class="subtitle">La tua password è scaduta o è il primo accesso. Scegli una nuova password per continuare.</p>
      </div>
    </ng-template>

    <form [formGroup]="form" (ngSubmit)="cambiaPassword()">
      <div class="field">
        <app-form-field label="Password attuale" forId="passwordAttuale" 
        [error]="formValidation.getFieldError(form, 'passwordAttuale')">
          <input
            id="passwordAttuale"
            pInputText
            type="password"
            formControlName="passwordAttuale"
            class="w-full"
            placeholder="Password attuale" />
        </app-form-field>
        <!-- <label for="passwordAttuale">Password attuale</label>
        <input
          id="passwordAttuale"
          pInputText
          type="password"
          formControlName="passwordAttuale"
          class="w-full"
          placeholder="Password attuale" />
        @if (form.get('passwordAttuale')?.touched && form.get('passwordAttuale')?.hasError('required')) {
          <small class="p-error">La password attuale è obbligatoria.</small>
        }
        @if (form.get('passwordAttuale')?.touched && form.get('passwordAttuale')?.hasError('minlength')) {
          <small class="p-error">La password deve contenere almeno 6 caratteri.</small>
        } -->
      </div>

      <div class="field">
        <app-form-field label="Nuova password" forId="passwordNuova" 
        [error]="formValidation.getFieldError(form, 'passwordNuova') || (form.errors?.['passwordMismatch'] ? 'Le password non coincidono.' : null)">
          <input
            id="passwordNuova"
            pInputText
            type="password"
            formControlName="passwordNuova"
            class="w-full"
            placeholder="Nuova password" />
        </app-form-field>
        <!-- <label for="passwordNuova">Nuova password</label>
        <input
          id="passwordNuova"
          pInputText
          type="password"
          formControlName="passwordNuova"
          class="w-full"
          placeholder="Nuova password" />
        @if (form.get('passwordNuova')?.touched && form.get('passwordNuova')?.hasError('required')) {
          <small class="p-error">La nuova password è obbligatoria.</small>
        }
        @if (form.get('passwordNuova')?.touched && form.get('passwordNuova')?.hasError('minlength')) {
          <small class="p-error">La password deve contenere almeno 6 caratteri.</small>
    }-->
      </div>

      <div class="field">
        <app-form-field label="Conferma password" forId="passwordConferma" 
        [error]="formValidation.getFieldError(form, 'passwordConferma') || (form.errors?.['passwordMismatch'] ? 'Le password non coincidono.' : null)">
          <input
            id="passwordConferma"
            pInputText
            type="password"            formControlName="passwordConferma"
            class="w-full"
            placeholder="Conferma password" />
        </app-form-field>
        <!-- <label for="passwordConferma">Conferma password</label>
        <input
          id="passwordConferma"
          pInputText
          type="password"
          formControlName="passwordConferma"
          class="w-full"
          placeholder="Conferma password" />
        @if (form.get('passwordConferma')?.touched && form.get('passwordConferma')?.hasError('required')) {
          <small class="p-error">La conferma password è obbligatoria.</small>
        }
        @if (form.errors?.['passwordMismatch']) {
          <small class="p-error">Le password non coincidono.</small>
    }-->
      </div>

      <p-button
        type="submit"
        label="Cambio Password"
        styleClass="w-full mt-3"
        [loading]="loading()"
        [disabled]="form.invalid" />
    </form>
  </p-card>
</div>
