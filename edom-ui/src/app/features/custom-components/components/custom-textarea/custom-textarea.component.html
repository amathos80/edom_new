<div class="custom-textarea-wrapper">
  <textarea
    pTextarea
    [value]="value"
    [rows]="rows"
    [cols]="cols"
    [variant]="variant"
    [fluid]="fluid"
    [invalid]="effectiveInvalid"
    [placeholder]="placeholder"
    [readonly]="readonly"
    [attr.name]="name || null"
    [disabled]="isDisabled"
    [class]="styleClass"
    [attr.maxlength]="maxLength ?? null"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  ></textarea>

  @if (activeErrorMessage) {
    <small class="p-error validation-error-text">{{ activeErrorMessage }}</small>
  }
</div>
