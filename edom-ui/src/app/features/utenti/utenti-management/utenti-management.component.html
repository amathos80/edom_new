<p-toast></p-toast>

<p-card header="Gestione Utenti">
  <p-toolbar styleClass="mb-4">
    <ng-template #start>
      <button pButton label="Nuovo" icon="pi pi-plus" (click)="apriCreazione()"></button>
    </ng-template>
  </p-toolbar>

  <app-smart-table
    [value]="utenti()"
    [loading]="loading()"
    [columns]="tutteLeColonne"
    [requiredColumnKeys]="colonneSemprePresenti"
    [visibleColumnKeys]="colonneSelezionate()"
    (visibleColumnKeysChange)="aggiornaColonne($event)"
    [globalFilterFields]="campiFiltroGlobale"
    [showGlobalSearch]="true"
    [emptyMessage]="'Nessun utente disponibile.'"
    [dataKey]="'id'"
  >
    <div smartTableCaptionLeft class="caption-left">
      <h5 class="m-0">Elenco utenti</h5>
      <div class="preset-vista" role="group" aria-label="Preset vista tabella">
        <button pButton type="button" size="small" [outlined]="presetAttivo() !== 'operativa'" label="Operativa" (click)="applicaPreset('operativa')"></button>
        <button pButton type="button" size="small" [outlined]="presetAttivo() !== 'sicurezza'" label="Sicurezza" (click)="applicaPreset('sicurezza')"></button>
        <button pButton type="button" size="small" [outlined]="presetAttivo() !== 'anagrafica'" label="Anagrafica" (click)="applicaPreset('anagrafica')"></button>
      </div>
    </div>

    <ng-template appSmartTableCell="stato" let-u>
      <p-tag [value]="u.stato || 'Attivo'" [severity]="u.dataDisattivazione ? 'danger' : 'success'"></p-tag>
    </ng-template>

    <ng-template appSmartTableActions let-u>
      <button pButton type="button" text="true" icon="pi pi-pencil" label="Modifica" (click)="apriModifica(u)"></button>
      <button pButton type="button" text="true" severity="danger" icon="pi pi-trash" (click)="elimina(u)"></button>
      <button pButton type="button" text="true" icon="pi pi-ellipsis-v" class="mobile-only" (click)="apriModifica(u)"></button>
    </ng-template>
  </app-smart-table>
</p-card>

<p-dialog
  [visible]="dialogVisibile()"
  (visibleChange)="dialogVisibile.set($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '44rem' }"
  [header]="modalitaDialog() === 'crea' ? 'Nuovo Utente' : ('Modifica Utente - ' + (utenteSelezionato()?.codice || ''))"
  (onHide)="chiudiDialog()"
>
  <form [formGroup]="formUtente" class="form-utente" (ngSubmit)="salva()">
    <div class="field-grid">
      <app-form-field label="Codice" forId="codice" [error]="formValidation.getFieldError(formUtente, 'codice')">
        <input id="codice" pInputText type="text" formControlName="codice" />
      </app-form-field>

      <app-form-field label="Matricola" forId="matricola">
        <input id="matricola" pInputText type="text" formControlName="matricola" />
      </app-form-field>

      <app-form-field class="field-full" label="Codice fiscale" forId="codiceFiscale">
        <input id="codiceFiscale" pInputText type="text" formControlName="codiceFiscale" />
      </app-form-field>

      <app-form-field label="Cognome" forId="cognome" [error]="formValidation.getFieldError(formUtente, 'cognome')">
        <input id="cognome" pInputText type="text" formControlName="cognome" />
      </app-form-field>

      <app-form-field label="Nome" forId="nome" [error]="formValidation.getFieldError(formUtente, 'nome')">
        <input id="nome" pInputText type="text" formControlName="nome" />
      </app-form-field>

      <app-form-field class="field-full" label="Email" forId="email">
        <input id="email" pInputText type="text" formControlName="email" />
      </app-form-field>
    </div>

    <div class="checks">
      <div class="check-item">
        <p-checkbox inputId="flagSmartCard" binary="true" formControlName="flagSmartCard"></p-checkbox>
        <label for="flagSmartCard">Accesso Smart Card</label>
      </div>
      <div class="check-item">
        <p-checkbox inputId="flagCambiaPwd" binary="true" formControlName="flagCambiaPwd"></p-checkbox>
        <label for="flagCambiaPwd">Forza cambio password</label>
      </div>
      <div class="check-item">
        <p-checkbox inputId="disattivo" binary="true" formControlName="disattivo"></p-checkbox>
        <label for="disattivo">Utente disattivato</label>
      </div>
    </div>

    <div class="azioni-speciali">
      <button pButton type="button" severity="warn" outlined="true" icon="pi pi-key" label="Cambio password" (click)="apriCambioPassword()" [disabled]="modalitaDialog() === 'crea'"></button>
      <button pButton type="button" severity="secondary" outlined="true" icon="pi pi-refresh" label="Riattiva" (click)="riattiva()" [disabled]="modalitaDialog() === 'crea'"></button>
    </div>

    <div class="dialog-actions">
      <button pButton type="button" label="Annulla" severity="secondary" (click)="chiudiDialog()"></button>
      <button pButton type="submit" label="Salva" icon="pi pi-save" [loading]="saving()"></button>
    </div>
  </form>
</p-dialog>

<p-dialog
  [visible]="dialogCambioPasswordVisibile()"
  (visibleChange)="dialogCambioPasswordVisibile.set($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '32rem' }"
  header="Cambio Password"
  (onHide)="chiudiCambioPassword()"
>
  @if (utenteSelezionato(); as utente) {
    <app-cambio-password-dialog
      [utenteId]="utente.id"
      [saving]="savingCambioPassword()"
      (passwordCambiata)="onPasswordCambiata()"
      (annullaClicked)="chiudiCambioPassword()"
    ></app-cambio-password-dialog>
  }
</p-dialog>
