<div class="lookup-input-wrapper">
  @if (label) {
    <label class="lookup-label">{{ label }}</label>
  }

  <p-inputgroup>
    <app-custom-textbox-input
      type="text"
      [disabled]="false"
      [readonly]="true"
      [placeholder]="placeholder"
      [ngModel]="displayValue"
      (ngModelChange)="onInput($event)"
      (blur)="onBlur()"
      [invalid]="effectiveInvalid"
    />
    <p-inputgroup-addon>
      <button
        pButton
        type="button"
        icon="pi pi-search"
        [disabled]="disabled"
        [attr.aria-label]="searchButtonAriaLabel"
        (click)="openDialog()"
      ></button>
    </p-inputgroup-addon>
    <p-inputgroup-addon>
      <button
        pButton
        type="button"
        icon="pi pi-times"
        severity="secondary"
        [disabled]="disabled || readonly || !displayValue"
        [attr.aria-label]="clearButtonAriaLabel"
        (click)="clearValue()"
      ></button>
    </p-inputgroup-addon>
  </p-inputgroup>

  @if (activeErrorMessage) {
    <small class="p-error validation-error-text">{{ activeErrorMessage }}</small>
  }
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '70rem', maxWidth: '96vw', height: '80vh' }"
  [header]="dialogTitle"
  (onHide)="closeDialog()"
>
  @if (dialogContent) {
    <ng-container
      [ngTemplateOutlet]="dialogContent.templateRef"
      [ngTemplateOutletContext]="{ close: closeDialog.bind(this), value: displayValue, emitResult: emitResult.bind(this) }"
    ></ng-container>
  } @else {
    <p class="dialog-empty">Nessun contenuto impostato per la ricerca.</p>
  }
</p-dialog>
